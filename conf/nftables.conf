#!/usr/sbin/nft -f

# Accept DHCP requests from containers

table inet filter {
    chain input {
        iifname "incusbr0" ip daddr 255.255.255.255 tcp dport 67 counter accept comment "Incus DHCP";
        iifname "incusbr0" ip daddr 255.255.255.255 udp dport 67 counter accept comment "Incus DHCP";
    }
}
